<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bat-Mitzvah Mélissa — Trouvez votre table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Dancing+Script:wght@600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#b8436f;--rose-d:#a93d68;--rose-l:#d98aa9;--gold:#8c6f17;--ink:#4a2d3b;--muted:#7a5a68}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;background:#f0e4e8;color:var(--ink);font-family:"Jost",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:520px;text-align:center;padding:34px 24px 44px;border-radius:22px;box-shadow:0 14px 40px rgba(120,50,80,.14);
background:
radial-gradient(circle at 16% 22%,rgba(255,255,255,.95),transparent 95px),
radial-gradient(circle at 88% 16%,rgba(255,252,245,.9),transparent 120px),
radial-gradient(circle at 78% 58%,rgba(255,248,235,.85),transparent 130px),
radial-gradient(circle at 20% 70%,rgba(255,255,255,.8),transparent 110px),
radial-gradient(circle at 46% 42%,rgba(255,236,190,.95) 0 2px,transparent 3px),
radial-gradient(circle at 56% 47%,rgba(255,236,190,.9) 0 1.5px,transparent 2.5px),
radial-gradient(circle at 38% 52%,rgba(255,236,190,.8) 0 2px,transparent 3px),
radial-gradient(circle at 64% 38%,rgba(255,236,190,.8) 0 1.5px,transparent 2.5px),
linear-gradient(180deg,#f7f3ed,#e8e4dd)}
.eyebrow{position: relative; z-index: 1;margin:0;font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:clamp(1.7rem,8vw,2.4rem);letter-spacing:.03em;color:#b08a1c;line-height:1.1}
.name{position: relative; z-index: 1;margin:0;font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:clamp(4rem,19vw,5.6rem);line-height:1;color:var(--rose)}
.welcome{position: relative; z-index: 1;margin:22px auto 22px;max-width:22em;font-weight:300;font-size:1.1rem;line-height:1.55;color:var(--muted)}
h2{position: relative; z-index: 1;margin:80px 0 0;font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:clamp(2.2rem,9vw,2.9rem);line-height:1.15;color:var(--rose)}
.rule{position: relative; z-index: 1;display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto;}
.rule:before,.rule:after{content:"";width:100px;height:1px;background:#1c1c1c}
.rule:after{transform:scaleX(-1)}
.rule span{font-size:.7rem}
.instructions{margin:0 0 18px;font-size:1.15rem;line-height:1.5}
.instructions em{display:block;margin-top:2px;font-style:normal;font-weight:300;font-size:.92rem;color:var(--muted)}
form{display:flex;align-items:center;gap:10px;padding:6px 18px;background:rgba(255,255,255,.88);border:1.5px solid var(--rose-l);border-radius:999px}
form:focus-within{border-color:var(--rose);box-shadow:0 0 0 3px rgba(184,67,111,.18)}
.search-icon{flex:0 0 auto;width:24px;height:24px}
input{width:100%;min-width:0;padding:12px 2px;border:0;outline:0;background:transparent;color:var(--ink);font:400 1.05rem "Jost",system-ui,sans-serif}
input::placeholder{color:#a58996;opacity:1}
button{margin-top:14px;padding:13px 34px;border:0;border-radius:999px;background:linear-gradient(180deg,#c4537f,var(--rose-d));color:#fff;font:500 .95rem "Jost",system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 16px rgba(169,61,104,.28)}
button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.result{min-height:1.5em;margin:22px 0 0}
.result p{margin:0}
.msg{font-weight:300;font-size:1.05rem;line-height:1.5;color:var(--muted)}
.guest{padding:16px 0;border-top:1px solid rgba(184,67,111,.22)}
.guest:first-child{border-top:0}
.who{font-weight:500;font-size:1.15rem}
.bow {
    position: absolute;
    top: 10px;
    z-index: 0;
    opacity: 0.4;
    left: 50%;
    transform: translateX(-50%);
    max-width: 350px;
    width: 100%;
  
}
.noeud {
  position: relative;
  top: 3px;
  width: 25px;
}
.tbl{margin-top:6px;font-family:"Cinzel",Georgia,serif;font-weight:600;font-size:clamp(1.25rem,5.4vw,1.55rem);letter-spacing:.04em;line-height:1.25;color:var(--gold);text-wrap:balance}
.closing{margin:20px 0 0;font-family:"Dancing Script","Brush Script MT",cursive;font-weight:600;font-size:1.6rem;color:var(--rose)}
@media (max-width:540px){body{padding:0}.card{border-radius:0;box-shadow:none;min-height:100vh}}
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">BAT-MITZVAH</p>
  <p class="name">Mélissa</p>
  <img src="noeud-rose.png" alt="" class="bow">
  <h2>Trouvez votre table</h2>
  <div class="rule"><span><img src="noeud-papillon.png" alt="" class="noeud"></span></div>
  <p class="instructions">Entrez votre nom de famille<em>(3 premières lettres ou nom complet)</em></p>
  <form id="searchForm" role="search">
    <svg class="search-icon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="13" r="9" fill="none" stroke="#b8436f" stroke-width="2.5"/><path d="M20 20 L29 29" fill="none" stroke="#b8436f" stroke-width="2.5" stroke-linecap="round"/></svg>
    <input id="surname" type="search" autocomplete="off" aria-label="Nom de famille">
  </form>
  <button type="submit" form="searchForm">Rechercher</button>
  <div id="result" class="result" aria-live="polite"></div>
  <p class="closing">Belle fête à tous&nbsp;!</p>
</main>

/* ================================================================ */

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const nice = s => s.trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const seen = new Set();
const INDEX = [];
INVITES.forEach(([n, p, t]) => {
  const id = norm(n) + "|" + norm(p) + "|" + t.trim();
  if (seen.has(id)) return;
  seen.add(id);
  INDEX.push({ n: nice(n), p: nice(p), t: t.trim(),
    keys: [norm(n), norm(n + " " + p), norm(p + " " + n), ...norm(n).split(" ")] });
});
const out = document.getElementById("result");

function message(text) {
  out.textContent = "";
  const p = document.createElement("p");
  p.className = "msg";
  p.textContent = text;
  out.append(p);
}

document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = norm(document.getElementById("surname").value);
  if (q.length < 3) return message("Entrez au moins les 3 premières lettres de votre nom.");
  const found = INDEX.filter(g => g.keys.some(k => k.startsWith(q)));
  if (!found.length) return message("Nous ne trouvons pas ce nom. Vérifiez l'orthographe, ou demandez à la famille.");
  found.sort((a, b) => a.n.localeCompare(b.n, "fr") || a.p.localeCompare(b.p, "fr"));
  out.textContent = "";
  found.forEach(g => {
    const d = document.createElement("div");
    d.className = "guest";
    const w = document.createElement("p");
    w.className = "who";
    w.textContent = g.p + " " + g.n;
    const t = document.createElement("p");
    t.className = "tbl";
    t.textContent = g.t;
    d.append(w, t);
    out.append(d);
  });
});
